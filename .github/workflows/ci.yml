name: CI

# プルリクエストと、公開前(deploy.yml から呼び出し)に実行する。
# ビルド(型チェック・索引の生成・出典の検査)と、ブラウザでのテストが通らないと、公開しない。
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsc の型チェック、検索索引・クイズ・学習時間の生成、出典の記録の検査も、ここで行われる
      - run: npm run build
      # パスの URL 版(試作。Issue #15)のビルド。本番のデプロイ(deploy.yml)は、ハッシュ版(npm run build の dist)のまま。ここでは、試作の検査のために、ビルドする
      - run: npm run build:path
      - run: npm run build:path:root
      # 引き継ぎ(hydrate)の診断用の局所的な生成(Issue #19)。記録された不一致 7 件と対照の 1 件だけ。全レッスンの生成ではない
      - run: npm run build:path:diag
      - run: npm run typecheck:e2e
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      # 同じ診断を、React の開発用ビルド(属性の不一致も警告する)でも行う。本番の配信物ではない
      - run: npm run build:path:diag:dev
      - run: npx playwright test --project=diag
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
