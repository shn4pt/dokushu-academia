# Issue #32、docs/seo/ci-plan.md(設計・根拠・運用)。草案 docs/seo/ci-plan-draft/ と、コメント以外は同一(e2e/ci-classify.spec.ts が確認)。
# 変更の分類で、文書だけのときは、重い手順を省く。**ジョブは、従来と同じ名前(`test`)の 1 つ**にする:
#   - 必須チェックの設定(あれば)の名前が、変わらない。workflow ごと省かない(paths-ignore は、必須チェックが Pending のままになる)ので、常にジョブが実行され、成功・失敗が決まる。
#   - 別のジョブを足さない(ジョブごとに、1 分に切り上げて課金されるため)。
name: CI

on:
  pull_request:
  workflow_call:
    outputs:
      full:
        description: 完全な検査を実行したか(deploy.yml が、ビルド・配信の要否に使う)
        value: ${{ jobs.test.outputs.full }}
  workflow_dispatch:

permissions:
  contents: read
  deployments: read # main の基準(最後に配信したコミット)を、配信の記録から読む

# PR: 同じ PR の古い実行は、取り消す。
# main(公開用): **実行ごとに別の group**(待機中の実行が、新しい実行に置き換えられて、取り消されないように。置き換えられると、その実行のコードが、検査も配信もされない恐れがある)。
#   順序の逆転(古い実行が、後から配信する)は、deploy.yml の「最新の main か」の確認で防ぐ。基準は、直前の push ではなく、**最後に配信したコミット**にする(下の分類)。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      full: ${{ steps.c.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 分類に、基準との差分が要る
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: c
        name: 変更を分類する(取得に失敗した場合・基準がない場合・基準が祖先でない場合は、完全な検査。安全側)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          full=true
          out=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            out="$(node scripts/ci-classify.mjs "origin/${{ github.base_ref }}" || true)"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # 基準 = **最後に配信に成功したコミット**(github-pages の deployment の記録)。直前の push ではない:
            # 検査・配信されなかったコード(取り消し・失敗・配信の省略)が、あいだに入っていても、その差が含まれるので、見落とさない。強制 push も、祖先でなければ完全。
            base=""
            for id in $(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=20" --jq '.[].id' 2>/dev/null || true); do
              st="$(gh api "repos/${{ github.repository }}/deployments/$id/statuses?per_page=1" --jq '.[0].state' 2>/dev/null || true)"
              if [ "$st" = "success" ]; then base="$(gh api "repos/${{ github.repository }}/deployments/$id" --jq '.sha' 2>/dev/null || true)"; break; fi
            done
            if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null && git merge-base --is-ancestor "$base" "${{ github.sha }}"; then
              out="$(git diff --no-renames --name-only "$base" "${{ github.sha }}" | node scripts/ci-classify.mjs - || true)"
            fi
          fi
          echo "$out"
          if echo "$out" | grep -q '"fullTests": false'; then full=false; fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          if [ "$full" = "false" ]; then
            echo "### 完全な検査を省略(文書だけの変更)" >> "$GITHUB_STEP_SUMMARY"
            echo "$out" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 完全な検査を実行" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.c.outputs.full == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: steps.c.outputs.full == 'true'
        run: npm ci
      - if: steps.c.outputs.full == 'true'
        run: npm run build
      - if: steps.c.outputs.full == 'true'
        run: |
          npm run build:path
          npm run build:path:root
          npm run build:path:diag
          npm run build:legacy-rescue
          npm run typecheck:e2e
      - if: steps.c.outputs.full == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.c.outputs.full == 'true'
        run: npx playwright test
      - if: steps.c.outputs.full == 'true'
        run: |
          npm run build:path:diag:dev
          npx playwright test --project=diag
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
